# MemKeys Inspector UI — nginx server config (ISI-6406, parent ISI-6395 B1).
#
# frontend/Dockerfile installs this file as /etc/nginx/nginx.conf.template;
# frontend/docker-entrypoint.sh renders it to /etc/nginx/conf.d/default.conf
# at container start, substituting ${MEMORY_API_UPSTREAM} (default
# `memkeys:3000` — the in-cluster memkeys Service /memory/* listener,
# charts/memkeys memoryTransport.port). Everything else is plain nginx
# syntax: the SPA is served with a history-API fallback, and /memory/ is
# reverse-proxied so the UI works same-origin (the SPA hardcodes the relative
# API_BASE_URL='/memory').

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # History-API fallback: the SPA is a single page, so any path that is not
    # a real file (JS/CSS assets, sourcemaps) serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: /memory/* is reverse-proxied to the memory API
    # upstream. proxy_pass carries no URI part, so the original /memory/*
    # path is forwarded unchanged. Client headers (Authorization bearer run
    # token, X-MemKeys-Tenant) pass through by default.
    location /memory/ {
        proxy_pass http://${MEMORY_API_UPSTREAM};

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The memory API streams/long-polls; do not buffer responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Never cache index.html so deploys roll out on the next load; Vite
    # content-hashes /assets/*, so those can be cached aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
