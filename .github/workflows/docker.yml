name: Docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: memkeys
  INSPECTOR_IMAGE_NAME: memkeys-inspector

jobs:
  docker:
    name: docker-build + sbom + grype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-memkeys.spdx.json

      - name: Scan image with grype (fail on critical)
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
          output-format: table

  docker-inspector:
    name: docker-inspector-build + sbom + grype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          load: true
          tags: ${{ env.INSPECTOR_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=inspector
          cache-to: type=gha,mode=max,scope=inspector

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.INSPECTOR_IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-memkeys-inspector.spdx.json

      - name: Scan image with grype (fail on critical)
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.INSPECTOR_IMAGE_NAME }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
          output-format: table

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny (pinned)
        run: |
          curl -sSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          cargo deny --version

      - name: cargo-deny (advisories, bans, licenses)
        run: cargo deny --manifest-path Cargo.toml check advisories bans licenses
