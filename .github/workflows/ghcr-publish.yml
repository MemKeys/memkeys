name: GHCR Publish

# Publishes both container images built in this repo to GHCR as public,
# multi-arch (linux/amd64 + linux/arm64) images (ISI-6304, part A of ISI-6288).
#
# Separate from the GitHub Release workflow (release.yml, ISI-6306): that one
# cuts a changelog + SBOM-asset GitHub Release on v* tags and is credential-
# free; this one pushes the images to GHCR. Distinct concurrency groups so the
# two never block each other on a shared v* tag. They can be consolidated into
# a single tag pipeline (build+push → SBOM → release) in a later pass.
#
#   ghcr.io/memkeys/memkeys-server    (root Dockerfile)
#   ghcr.io/memkeys/memkeys-operator  (operator/Dockerfile)
#   ghcr.io/memkeys/memkeys-inspector (frontend/Dockerfile, ISI-6406)
#
# The PR build-only gates stay in docker.yml (load + grype) and operator.yml
# (vet/test) — this workflow NEVER runs on pull_request, so the PR path is
# unchanged. Push to main → tags `main`, `sha-<sha>`, `latest`. Git tag `v*`
# → semver tags. Namespace is this repo's own org, so the built-in
# GITHUB_TOKEN can push (no PAT needed for push).

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.image }} (multi-arch → GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing + provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: memkeys-server
            context: .
            dockerfile: Dockerfile
            title: MemKeys Server
            description: "MemKeys memory server — the agent-memory HTTP + MCP service."
          - image: memkeys-operator
            context: operator
            dockerfile: operator/Dockerfile
            title: MemKeys Operator
            description: "Kubernetes operator for the MemKeysInstance CRD (memkeys.io)."
          - image: memkeys-inspector
            context: frontend
            dockerfile: frontend/Dockerfile
            title: MemKeys Inspector UI
            description: "MemKeys Inspector SPA served by nginx, reverse-proxying /memory to the memory API (ISI-6406)."
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/memkeys/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=MemKeys
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign by digest so every tag that points at it is covered once.
          cosign sign --yes "ghcr.io/memkeys/${{ matrix.image }}@${DIGEST}"
