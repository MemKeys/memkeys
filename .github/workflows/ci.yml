name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: memkeys
          POSTGRES_PASSWORD: memkeys
          POSTGRES_DB: memkeys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memkeys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://memkeys:memkeys@localhost:5432/memkeys_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test --workspace

      - name: Conformance suite (M8 promotion gate)
        run: cargo run --release -p memkeys-bench --bin conformance

      - name: Write-path benchmark smoke (harness executes end to end)
        run: |
          cargo run --release -p memkeys-bench --bin write-bench -- \
            --ops 200 --warmup 20 --read-ops 200 --json -

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: memkeys
          POSTGRES_PASSWORD: memkeys
          POSTGRES_DB: memkeys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memkeys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://memkeys:memkeys@localhost:5432/memkeys_test
      # Line-coverage floor (ISI-6100 / ISI-6094-P2). Measured baseline on main
      # @ 1bddee7 is 63.78%, so the default sits just below it: the gate blocks
      # coverage regressions without failing every PR on day one. Ratchet toward
      # the plan's 70% target by raising COVERAGE_MIN (Settings → Variables) as
      # coverage improves; the variable always wins over this default.
      COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '60' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests under cargo-llvm-cov (lcov report)
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Coverage gate (fail below COVERAGE_MIN)
        run: |
          # lcov emits "LF:20"/"LH:15" with no space after the colon, so split on
          # the colon — plain $2 would be empty and the sums would stay 0.
          read -r lh lf < <(awk -F: '/^LH:/{lh+=$2} /^LF:/{lf+=$2} END{print lh+0, lf+0}' lcov.info)
          if [ "$lf" -le 0 ]; then
            echo "::error::Coverage report has no instrumented lines (LF=0) — llvm-cov produced no data."
            exit 1
          fi
          pct=$(awk -v lh="$lh" -v lf="$lf" 'BEGIN{printf "%.2f", 100*lh/lf}')
          min="$COVERAGE_MIN"
          {
            echo "### Coverage"
            echo ""
            echo "- Line coverage: **${pct}%** (${lh}/${lf} lines)"
            echo "- Threshold: **${min}%** (\`COVERAGE_MIN\`)"
            echo "- Full lcov report is uploaded as the \`coverage-lcov\` workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          # awk exits non-zero when pct < min, so the step fails the job.
          if awk -v p="$pct" -v m="$min" 'BEGIN{exit !(p+0 >= m+0)}'; then
            echo "Coverage ${pct}% meets the ${min}% threshold."
          else
            echo "::error title=Coverage below threshold::Line coverage ${pct}% is below the required ${min}% (COVERAGE_MIN). Add tests or lower COVERAGE_MIN."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint (pinned)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
          actionlint --version

      - name: Lint GitHub Actions workflow files
        run: actionlint

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo-machete
