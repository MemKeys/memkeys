name: Benchmarks

# Perf-regression tracking (ISI-6100 / ISI-6094 P2). Runs ONLY off the PR hot
# path so the PR gate stays fast: on pushes to main, on a nightly schedule, and
# on manual dispatch. Compares each run against the stored baseline and reports
# regressions as annotations + a job summary; it never gates a PR.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
  schedule:
    # Nightly 03:17 UTC — catches regressions merged without touching crates/**.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Serialize baseline updates; never cancel an in-flight baseline write.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  bench:
    name: criterion hot paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run criterion benches (bencher format for tracking)
        run: |
          # Start Criterion clean so every run is a first-run. Swatinem/rust-cache
          # can partially restore target/criterion, leaving a stale/partial
          # base/sample.json; Criterion then injects a
          #   "Criterion.rs ERROR: ... base/sample.json: No such file or directory"
          # line *between* the `test <name> ...` and `bench: <n> ns/iter` lines,
          # which splits the single-line bencher format the report action parses
          # and makes it report "No benchmark result was found" (ISI-6782).
          rm -rf target/criterion
          cargo bench -p memkeys-bench --bench hot_paths -- --output-format bencher \
            | tee bench-output.txt
          # Fail fast (loudly) if the benches produced no measurements at all, so a
          # real "no output" problem is surfaced here rather than swallowed by the
          # report step's continue-on-error below.
          if ! grep -q 'ns/iter' bench-output.txt; then
            echo "::error::No 'ns/iter' lines in bench-output.txt — benches produced no measurements." >&2
            exit 1
          fi

      # The comparable baseline/report artifact (criterion keeps full HTML +
      # estimates under target/criterion; bench-output.txt is the machine copy).
      - name: Upload benchmark report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report-${{ github.sha }}
          path: |
            bench-output.txt
            target/criterion/**
          if-no-files-found: warn
          retention-days: 90

      # Restore the rolling baseline (no gh-pages / push secret needed — the
      # baseline lives in the Actions cache keyed by commit, newest restored).
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: ./cache/benchmark-data.json
          key: benchmark-data-${{ github.sha }}
          restore-keys: |
            benchmark-data-

      - name: Compare against baseline + report regressions
        # Report-only: a hiccup in the comparison/report step must never fail the
        # job. The real "no measurements" case is already caught loudly above
        # (ISI-6782 defense-in-depth).
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: memkeys hot paths
          tool: cargo
          output-file-path: bench-output.txt
          external-data-json-path: ./cache/benchmark-data.json
          # >1.5x slower than the stored baseline is flagged.
          alert-threshold: "150%"
          # Report-only: annotate + job summary, but do not fail the build.
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true

      - name: Save updated benchmark baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./cache/benchmark-data.json
          key: benchmark-data-${{ github.sha }}
