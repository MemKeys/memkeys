<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" fill="none" role="img" aria-label="MemKeys architecture: agents store facts keyed by attribute in one keyed core; graph and vector are derived views on top.">
  <title>MemKeys architecture — keyed-first, graph and vector as derived views</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17356F"/>
      <stop offset="1" stop-color="#3E6FD9"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3E7E"/>
      <stop offset="1" stop-color="#17356F"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3E6FD9"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8AA6D8"/>
    </marker>
  </defs>

  <style>
    text{font-family:'IBM Plex Sans',system-ui,Segoe UI,sans-serif}
    .h{font-weight:700;fill:#17356F}
    .lbl{font-weight:600;fill:#17356F}
    .sub{font-weight:400;fill:#4A618C}
    .chip{font-weight:600;fill:#17356F}
    .white{fill:#EAF1FF}
    .mono{font-family:'IBM Plex Mono','SF Mono',ui-monospace,monospace}
  </style>

  <rect width="1200" height="640" fill="#F7F4EC"/>

  <!-- ===================== AGENTS (input) ===================== -->
  <text class="h" x="60" y="70" font-size="20">Your agents</text>
  <g>
    <rect x="60" y="92" width="150" height="56" rx="12" fill="#fff" stroke="#17356F" stroke-width="1.5"/>
    <circle cx="90" cy="120" r="10" fill="url(#ring)"/>
    <text class="lbl" x="110" y="117" font-size="14">Coder</text>
    <text class="sub" x="110" y="134" font-size="11">writes · recalls</text>

    <rect x="60" y="162" width="150" height="56" rx="12" fill="#fff" stroke="#17356F" stroke-width="1.5"/>
    <circle cx="90" cy="190" r="10" fill="url(#ring)"/>
    <text class="lbl" x="110" y="187" font-size="14">Reviewer</text>
    <text class="sub" x="110" y="204" font-size="11">writes · recalls</text>

    <rect x="60" y="232" width="150" height="56" rx="12" fill="#fff" stroke="#17356F" stroke-width="1.5"/>
    <circle cx="90" cy="260" r="10" fill="url(#ring)"/>
    <text class="lbl" x="110" y="257" font-size="14">Researcher</text>
    <text class="sub" x="110" y="274" font-size="11">writes · recalls</text>
  </g>

  <!-- 4-op contract pill -->
  <rect x="78" y="312" width="114" height="30" rx="15" fill="#17356F"/>
  <text class="white mono" x="135" y="332" font-size="12" text-anchor="middle">4-op contract</text>
  <text class="sub mono" x="135" y="364" font-size="11" text-anchor="middle">store · fetch</text>
  <text class="sub mono" x="135" y="380" font-size="11" text-anchor="middle">search · traverse</text>

  <!-- arrows agents -> core -->
  <path d="M212 120 C 250 120, 250 300, 300 300" stroke="#3E6FD9" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M212 190 C 250 190, 255 310, 300 312" stroke="#3E6FD9" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M212 260 C 250 260, 258 322, 300 324" stroke="#3E6FD9" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== KEYED CORE ===================== -->
  <rect x="300" y="60" width="330" height="520" rx="20" fill="#0B1830"/>
  <text class="white" x="330" y="100" font-size="22" font-weight="700">The keyed core</text>
  <text x="330" y="124" font-size="13" fill="#8AA6D8">Every fact stored by the keys that describe it</text>

  <!-- fact card template x3 -->
  <!-- card 1 -->
  <g>
    <rect x="330" y="150" width="270" height="118" rx="14" fill="#13294F" stroke="#2A4A86" stroke-width="1.5"/>
    <!-- keyed value + keyhole -->
    <circle cx="356" cy="182" r="9" fill="#F7C948"/>
    <path d="M352.3 188.2 L359.7 188.2 L357.7 202 L354.3 202 Z" fill="#F7C948"/>
    <text class="white mono" x="376" y="180" font-size="13" font-weight="700">"use pgvector/pgvector:pg18"</text>
    <text x="376" y="197" font-size="11" fill="#8AA6D8">keyed value</text>
    <!-- attribute chips -->
    <g font-size="11" class="mono">
      <rect x="330" y="214" width="92" height="22" rx="11" fill="#1C3A6E"/>
      <text class="white" x="376" y="229" text-anchor="middle">project:memkeys</text>
      <rect x="430" y="214" width="78" height="22" rx="11" fill="#1C3A6E"/>
      <text class="white" x="469" y="229" text-anchor="middle">issue:6319</text>
      <rect x="516" y="214" width="70" height="22" rx="11" fill="#1C3A6E"/>
      <text class="white" x="551" y="229" text-anchor="middle">agent:arch</text>
    </g>
    <!-- validity window -->
    <rect x="330" y="246" width="270" height="8" rx="4" fill="#09142A"/>
    <rect x="330" y="246" width="150" height="8" rx="4" fill="#F7C948" opacity="0.85"/>
    <text x="330" y="246" font-size="0">valid window</text>
  </g>

  <!-- card 2 -->
  <g>
    <rect x="330" y="282" width="270" height="118" rx="14" fill="#13294F" stroke="#2A4A86" stroke-width="1.5"/>
    <circle cx="356" cy="314" r="9" fill="#F7C948"/>
    <path d="M352.3 320.2 L359.7 320.2 L357.7 334 L354.3 334 Z" fill="#F7C948"/>
    <text class="white mono" x="376" y="312" font-size="13" font-weight="700">"VIP is 10.0.0.220"</text>
    <text x="376" y="329" font-size="11" fill="#8AA6D8">keyed value</text>
    <g font-size="11" class="mono">
      <rect x="330" y="346" width="92" height="22" rx="11" fill="#1C3A6E"/>
      <text class="white" x="376" y="361" text-anchor="middle">project:memkeys</text>
      <rect x="430" y="346" width="92" height="22" rx="11" fill="#1C3A6E"/>
      <text class="white" x="476" y="361" text-anchor="middle">env:k8squad</text>
      <rect x="530" y="346" width="56" height="22" rx="11" fill="#1C3A6E"/>
      <text class="white" x="558" y="361" text-anchor="middle">pr:39</text>
    </g>
    <rect x="330" y="378" width="270" height="8" rx="4" fill="#09142A"/>
    <rect x="330" y="378" width="210" height="8" rx="4" fill="#F7C948" opacity="0.85"/>
  </g>

  <!-- card 3 -->
  <g>
    <rect x="330" y="414" width="270" height="118" rx="14" fill="#13294F" stroke="#2A4A86" stroke-width="1.5"/>
    <circle cx="356" cy="446" r="9" fill="#F7C948"/>
    <path d="M352.3 452.2 L359.7 452.2 L357.7 466 L354.3 466 Z" fill="#F7C948"/>
    <text class="white mono" x="376" y="444" font-size="13" font-weight="700">"chart v0.3.0 → OCI"</text>
    <text x="376" y="461" font-size="11" fill="#8AA6D8">keyed value</text>
    <g font-size="11" class="mono">
      <rect x="330" y="478" width="92" height="22" rx="11" fill="#1C3A6E"/>
      <text class="white" x="376" y="493" text-anchor="middle">project:memkeys</text>
      <rect x="430" y="478" width="98" height="22" rx="11" fill="#1C3A6E"/>
      <text class="white" x="479" y="493" text-anchor="middle">decision:release</text>
    </g>
    <rect x="330" y="510" width="270" height="8" rx="4" fill="#09142A"/>
    <rect x="330" y="510" width="110" height="8" rx="4" fill="#F7C948" opacity="0.85"/>
  </g>

  <!-- legend inside core -->
  <circle cx="340" cy="556" r="6" fill="#F7C948"/>
  <text x="352" y="560" font-size="11" fill="#8AA6D8">keyed value</text>
  <rect x="452" y="551" width="24" height="7" rx="3.5" fill="#F7C948" opacity="0.85"/>
  <text x="482" y="560" font-size="11" fill="#8AA6D8">validity window (true then, not just cached now)</text>

  <!-- ===================== DERIVED VIEWS ===================== -->
  <text class="h" x="700" y="70" font-size="20">Derived views</text>
  <text class="sub" x="700" y="90" font-size="13">built on top of the keyed core — never a separate store</text>

  <!-- derived arrows from core -->
  <path d="M636 210 C 680 210, 690 185, 740 185" stroke="#8AA6D8" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowD)"/>
  <path d="M636 450 C 680 450, 690 470, 740 470" stroke="#8AA6D8" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowD)"/>
  <text class="sub mono" x="648" y="178" font-size="11">derived</text>
  <text class="sub mono" x="648" y="492" font-size="11">derived</text>

  <!-- GRAPH VIEW panel -->
  <rect x="740" y="120" width="400" height="190" rx="16" fill="#fff" stroke="#8AA6D8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="lbl" x="762" y="150" font-size="16">Graph view</text>
  <text class="sub" x="762" y="169" font-size="12">traverse relationships between keyed facts</text>
  <!-- nodes/edges -->
  <g stroke="#3E6FD9" stroke-width="2">
    <line x1="840" y1="250" x2="930" y2="215"/>
    <line x1="930" y1="215" x2="1030" y2="250"/>
    <line x1="930" y1="215" x2="960" y2="285"/>
    <line x1="840" y1="250" x2="960" y2="285"/>
    <line x1="1030" y1="250" x2="1075" y2="285"/>
  </g>
  <g>
    <circle cx="840" cy="250" r="13" fill="#17356F"/>
    <circle cx="930" cy="215" r="15" fill="#F7C948"/>
    <circle cx="1030" cy="250" r="13" fill="#17356F"/>
    <circle cx="960" cy="285" r="11" fill="#17356F"/>
    <circle cx="1075" cy="285" r="11" fill="#17356F"/>
  </g>
  <text class="sub" x="930" y="196" font-size="10" text-anchor="middle" fill="#8A6B12">keyed node</text>

  <!-- VECTOR VIEW panel -->
  <rect x="740" y="390" width="400" height="190" rx="16" fill="#fff" stroke="#8AA6D8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="lbl" x="762" y="420" font-size="16">Vector view</text>
  <text class="sub" x="762" y="439" font-size="12">semantic search when you don't know the key</text>
  <!-- similarity radius -->
  <circle cx="930" cy="505" r="54" fill="#F7C948" opacity="0.10"/>
  <circle cx="930" cy="505" r="54" fill="none" stroke="#F7C948" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- query point (keyed/golden) -->
  <circle cx="930" cy="505" r="7" fill="#F7C948"/>
  <!-- neighbours -->
  <g fill="#3E6FD9">
    <circle cx="900" cy="485" r="5"/>
    <circle cx="958" cy="490" r="5"/>
    <circle cx="912" cy="535" r="5"/>
    <circle cx="965" cy="528" r="5"/>
    <circle cx="890" cy="520" r="5"/>
  </g>
  <!-- distant points -->
  <g fill="#B9C6DE">
    <circle cx="820" cy="445" r="5"/>
    <circle cx="1050" cy="450" r="5"/>
    <circle cx="1080" cy="545" r="5"/>
    <circle cx="800" cy="555" r="5"/>
  </g>
  <text class="sub" x="930" y="472" font-size="10" text-anchor="middle" fill="#8A6B12">query</text>

  <!-- bottom caption strip -->
  <text class="h" x="600" y="620" font-size="15" text-anchor="middle">Store once, keyed.  Graph and vector are views on the same facts — not three copies to keep in sync.</text>
</svg>
