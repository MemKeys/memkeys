---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: memkeys-operator-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - memkeys.io
  resources:
  - memkeysinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - memkeys.io
  resources:
  - memkeysinstances/finalizers
  verbs:
  - update
- apiGroups:
  - memkeys.io
  resources:
  - memkeysinstances/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
