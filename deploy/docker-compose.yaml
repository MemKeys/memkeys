# MemKeys — single-container / single-VM quickstart (M10a, single-node profile).
#
# Container-first: brings up Postgres + memkeys-server with one command, no
# Kubernetes required. This mirrors the Helm chart's `profile: single-node`
# (one all-in-one server; writer + inline projection) for a laptop or a single
# VM. For the Kubernetes profiles (single-node and microservice) use the Helm
# chart under charts/memkeys — see charts/memkeys/README.md.
#
#   docker compose -f deploy/docker-compose.yaml up --build
#
# The server image is built from the repo-root Dockerfile. Set MEMKEYS_IMAGE to
# use a prebuilt image (e.g. ghcr.io/memkeys/memkeys:<tag>) instead of building.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: memkeys
      POSTGRES_PASSWORD: memkeys
      POSTGRES_DB: memkeys
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memkeys"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - memkeys-pgdata:/var/lib/postgresql/data

  memkeys:
    image: ${MEMKEYS_IMAGE:-memkeys:local}
    build:
      # Build context is the repo root (two levels up from this file), where
      # the Dockerfile and crates/ live.
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Required: Postgres connection string (migrations + FactStore).
      MEMKEYS_DATABASE_URL: postgres://memkeys:memkeys@postgres:5432/memkeys
      MEMKEYS_DEPLOYMENT_ENV: dev
      RUST_LOG: info
      # Optional: point at an OTLP/gRPC collector to enable telemetry.
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8080:8080"

volumes:
  memkeys-pgdata:
