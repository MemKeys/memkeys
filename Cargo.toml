[workspace]
resolver = "2"
members = ["crates/memkeys-server", "crates/memkeys-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MemKeys/memkeys"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# tls-rustls-ring-native-roots: rustls+ring with the OS trust store
# (rustls-native-certs) instead of the bundled webpki-roots crate. This keeps
# the webpki-roots 0.26 shim — flagged by RUSTSEC-2026-0381 and unpatched on the
# 0.26 line — out of the tree without a major sqlx upgrade. Our DSNs use the
# default sslmode=prefer (opportunistic TLS, no cert verification), so the root
# store is never consulted at runtime; verify-ca/verify-full would use OS roots.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# M3 — transport (HTTP /memory/*) + admission control.
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
base64 = "0.22"
hmac = "0.12"
# M5 — the real HTTP embedder adapter (MEMKEYS_EMBED_URL). rustls to match the
# sqlx tls stack (no new native-TLS/OpenSSL in the tree); json for the payload.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
