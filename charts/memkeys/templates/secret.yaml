{{- $dbSecret := and .Values.database.url (not .Values.database.existingSecret) -}}
{{- $runTokenSecret := and .Values.memoryTransport.runTokenSecret.value (not .Values.memoryTransport.runTokenSecret.existingSecret) -}}
{{- if $dbSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memkeys.databaseSecretName" . }}
  labels:
    {{- include "memkeys.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
{{- end }}
{{- if $runTokenSecret }}
{{- if $dbSecret }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memkeys.runTokenSecretName" . }}
  labels:
    {{- include "memkeys.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.memoryTransport.runTokenSecret.key }}: {{ .Values.memoryTransport.runTokenSecret.value | quote }}
{{- end }}
