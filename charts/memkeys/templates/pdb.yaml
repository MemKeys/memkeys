{{- if eq (include "memkeys.pdbEnabled" .) "true" }}
{{/*
PodDisruptionBudget for the server workload (microservice profile). Keeps the
Service-backed server available during voluntary disruptions (node drains,
rolling upgrades). Set exactly one of minAvailable / maxUnavailable.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "memkeys.fullname" . }}
  labels:
    {{- include "memkeys.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      {{- include "memkeys.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
{{- end }}
