apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "memkeys.fullname" . }}-config
  labels:
    {{- include "memkeys.labels" . | nindent 4 }}
data:
  MEMKEYS_DEPLOYMENT_ENV: {{ .Values.otel.deploymentEnv | quote }}
  # Keep the health surface's listen port pinned to the Service port so
  # containerPort / targetPort / MEMKEYS_HTTP_PORT always agree (a non-8080
  # service.port without this left /readyz bound to 8080 → never Ready).
  MEMKEYS_HTTP_PORT: {{ .Values.service.port | quote }}
  {{- with .Values.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.serviceNamespace }}
  MEMKEYS_SERVICE_NAMESPACE: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.tracesSamplerRatio }}
  MEMKEYS_TRACES_SAMPLER_RATIO: {{ . | quote }}
  {{- end }}
  {{- if .Values.semantic.enabled }}
  # Semantic search read path (ISI-6079). The embedder knobs below are honoured
  # only when this is on — otherwise the fact vector is never read.
  MEMKEYS_SEMANTIC: "1"
  {{- end }}
  {{- with .Values.semantic.embedder.url }}
  # OpenAI-compatible external embedder (ISI-6671/ISI-6678). Unset → the server
  # uses its built-in deterministic HashEmbedder (dim 256).
  MEMKEYS_EMBED_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.semantic.embedder.model }}
  MEMKEYS_EMBED_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.semantic.embedder.dim }}
  MEMKEYS_EMBED_DIM: {{ . | quote }}
  {{- end }}
