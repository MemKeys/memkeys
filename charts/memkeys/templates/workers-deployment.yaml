{{- if eq (include "memkeys.workersEnabled" .) "true" }}
{{/*
Async projection workers (microservice profile). Same memkeys-server image as
the server; the worker role is selected by workers.command/workers.args. These
rebuild the graph/vector projections off the keyed/temporal source of truth and
are NOT fronted by the Service (own selector, component=worker).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memkeys.workerFullname" . }}
  labels:
    {{- include "memkeys.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.workers.replicaCount }}
  selector:
    matchLabels:
      {{- include "memkeys.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the workers when config/secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with (include "memkeys.operatorAnnotations" .) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.workers.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "memkeys.workerSelectorLabels" . | nindent 8 }}
        {{- with .Values.workers.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "memkeys.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-worker
          image: {{ include "memkeys.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.workers.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workers.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MEMKEYS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "memkeys.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            # The worker role: projection-only (health surface + reconciler
            # tick, no memory transport) — honoured by the memkeys-server
            # binary via MEMKEYS_ROLE=worker.
            - name: MEMKEYS_ROLE
              value: worker
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "memkeys.fullname" . }}-config
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.workers.resources | nindent 12 }}
      {{- with .Values.workers.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workers.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workers.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workers.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
