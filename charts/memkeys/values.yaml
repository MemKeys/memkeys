# Default values for the memkeys chart.
# This is a YAML-formatted file. Values are documented inline.

# --- Deployment profile -----------------------------------------------------
# Selects which workloads the chart renders (M10a — both profiles):
#   single-node  — one all-in-one memkeys-server Deployment (writer + inline
#                  projection). Default; maps to the single VM/container
#                  profile. For the plain container/VM quickstart (Docker /
#                  Compose, no Kubernetes) see deploy/docker-compose.yaml and
#                  charts/memkeys/README.md.
#   microservice — server Deployment + a separate async-projection worker
#                  Deployment, plus a PodDisruptionBudget. Operator hook points
#                  (labels/annotations) are available in both profiles.
# Invalid values fail `helm template`/`helm install` fast.
profile: single-node

# Server replica count. null → profile default: 1 for single-node, 2 for
# microservice (so the PodDisruptionBudget can tolerate a node drain / rolling
# upgrade without blocking it). Set an explicit integer to override. A PDB is
# only rendered when the effective server replica count is > 1 — a PDB with
# minAvailable: 1 on a single replica would make `kubectl drain` block forever.
replicaCount: null

image:
  # Registry/repository for the memkeys-server image (built by the P0 docker.yml
  # workflow — ISI-6097). Overridden per-environment.
  repository: ghcr.io/memkeys/memkeys
  # Pull policy. IfNotPresent is correct for pinned tags / kind-loaded images.
  pullPolicy: IfNotPresent
  # Image tag. Defaults to the chart appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a dedicated ServiceAccount for the workload.
  create: true
  automount: false
  annotations: {}
  name: ""

# Extra pod annotations/labels.
podAnnotations: {}
podLabels: {}

# --- Security hardening -----------------------------------------------------
# Defaults assume a distroless/nonroot runtime image (UID/GID 65532), matching
# the P0 Dockerfile (ISI-6097). readOnlyRootFilesystem is on; the server needs
# no writable paths (migrations run against Postgres, not local disk).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

# --- Service ----------------------------------------------------------------
service:
  type: ClusterIP
  # Port the Service exposes and the health listener (MEMKEYS_HTTP_PORT)
  # binds: containerPort / targetPort / probes all follow it. The /memory/*
  # transport has its own listener — see memoryTransport below.
  port: 8080
  # Named container port.
  portName: http

# --- Memory transport (/memory/*) -------------------------------------------
# The server runs TWO distinct listeners: the health surface (/healthz, /readyz)
# on MEMKEYS_HTTP_PORT (service.port above) and the /memory/* transport on
# MEMKEYS_MEMORY_HTTP_PORT (default 3000). Exposing the memory transport off
# loopback requires a run-token issuer secret — the server refuses a
# non-loopback bind without one (open admission surface, ISI-6137 S1). The
# chart mirrors that gate: it fails `helm template`/`helm install` fast when
# memoryTransport is enabled with neither a credential nor an explicit
# dev-only insecure opt-in.
memoryTransport:
  # Whether the memory transport gets a containerPort + Service port and binds
  # 0.0.0.0. Disable to render the health-only surface (M10a behaviour).
  enabled: true
  # Port the memory transport listens on (MEMKEYS_MEMORY_HTTP_PORT) and the
  # Service exposes. Must differ from service.port — the two listeners would
  # collide inside the process otherwise.
  port: 3000
  # Named container/Service port for the memory transport.
  portName: memory
  runTokenSecret:
    # Inline issuer secret → the chart renders a Secret
    # <fullname>-run-token holding it. Dev convenience; prefer existingSecret.
    value: ""
    # Reference a pre-provisioned Secret holding the issuer secret instead.
    existingSecret: ""
    # Key within that Secret (or the rendered one).
    key: "MEMKEYS_RUN_TOKEN_SECRET"
  # Dev-only escape hatch: bind 0.0.0.0 with NO run-token verifier (the server
  # warns; tenant is self-asserted). Never use in a shared cluster.
  allowInsecure: false

# --- Inspector UI (frontend) ------------------------------------------------
# Optional, read-only Inspector SPA (ISI-6083 / ISI-6395 B2).
#
# Preferred since ISI-6476 — no extra Deployment at all: the server image
# bundles the SPA (root Dockerfile uibuild stage) and serves it at / on the
# memory-transport port (`MEMKEYS_UI_DIR=/usr/share/memkeys/ui`). The default
# httpRoute rules below already send all paths to the server backend, so
# simply enabling httpRoute + memoryTransport exposes the UI and the API on
# one origin — nginx-free (the board ruling on ISI-6395).
#
# The nginx sidecar below (ghcr.io/memkeys/memkeys-inspector, ISI-6406) is
# retained for the split-routing variant where the UI needs its own
# Deployment/Service. No new auth surface either way: the UI is read-through
# and calls the same token-gated /memory/* API as any other client.
#
# Same-origin wiring: the SPA calls the API at the relative path /memory, so the
# UI and the memory API must share one external origin. Two ways to wire it
# behind the Gateway:
#   (a) Route ALL paths to this frontend Service; the nginx image itself
#       reverse-proxies /memory -> frontend.memoryApiUpstream.
#   (b) Split at the HTTPRoute (lower-risk): / -> frontend Service,
#       /memory/* -> the memkeys server memory port (unchanged, token-gated).
#       Requires frontend.enabled=true; see the httpRoute.rules example below.
#   (c) Server-bundled (default, no frontend Deployment): route all paths to
#       the server memory port — the server serves both the SPA and the API.
frontend:
  enabled: false
  image:
    repository: ghcr.io/memkeys/memkeys-inspector
    pullPolicy: IfNotPresent
    # Image tag. Defaults to the chart appVersion when empty. Pin per-env.
    tag: ""
  replicaCount: 1
  service:
    type: ClusterIP
    # Port the Service exposes. The image's nginx listens on container port 80.
    port: 80
    portName: http
  # Upstream the nginx image reverse-proxies /memory to (option (a)). Empty →
  # the in-cluster memkeys Service on memoryTransport.port. Unused under the
  # HTTPRoute split (option (b)) but kept correct so single-Service exposure
  # also works.
  memoryApiUpstream: ""
  # The nginx image is NOT distroless-nonroot: its entrypoint renders the server
  # config and nginx writes temp/cache under /var, so it needs a writable
  # rootfs and the image's default user. Hence its own (looser) security
  # context, distinct from the hardened server context above.
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Gateway API ingress (HTTPRoute, not legacy Ingress) --------------------
# Disabled by default; enable and point at a parentRef Gateway to expose the
# service outside the cluster.
httpRoute:
  enabled: false
  # References to Gateway resources this route attaches to.
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []
  #  - memkeys.example.com
  annotations: {}
  # Match rules. Each rule may set `backend:` to pick the destination Service:
  #   server   (default) — the memkeys memory port (token-gated /memory/*), or
  #                        service.port when memoryTransport.enabled=false.
  #   frontend           — the Inspector UI Service (requires frontend.enabled).
  # Defaults to all paths on the server backend (unchanged pre-0.4.0 behaviour).
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
  # Same-origin split — serve the Inspector UI + memory API on ONE host behind
  # the memkeys-gw VIP (ISI-6395 B2). Longest-prefix match wins, so /memory/*
  # routes to the token-gated API and everything else to the UI. Requires
  # frontend.enabled=true:
  #  rules:
  #    - matches:
  #        - path:
  #            type: PathPrefix
  #            value: /memory
  #      backend: server
  #    - matches:
  #        - path:
  #            type: PathPrefix
  #            value: /
  #      backend: frontend

# --- Database wiring --------------------------------------------------------
# The server reads MEMKEYS_DATABASE_URL (required). Mirrors the TEST_DATABASE_URL
# pattern used by CI (postgres://user:pass@host:5432/db).
database:
  # When set, the chart renders a Secret holding MEMKEYS_DATABASE_URL.
  # Leave empty and set existingSecret to reference a pre-provisioned secret.
  url: ""
  # Reference an existing Secret instead of creating one.
  existingSecret: ""
  # Key within existingSecret (or the generated secret) holding the URL.
  existingSecretKey: "MEMKEYS_DATABASE_URL"

# --- Observability (OpenTelemetry) ------------------------------------------
# When otel.endpoint is set, the server exports OTLP/gRPC for all signals.
# Empty endpoint → no-op exporters (M4 behaviour).
otel:
  endpoint: ""
  # dev | staging | prod — drives sampling + resource attributes (M4).
  deploymentEnv: "dev"
  serviceNamespace: ""
  # Optional head-sampling ratio override (prod).
  tracesSamplerRatio: ""

# --- Extra environment ------------------------------------------------------
# Free-form env vars and envFrom sources merged into the container.
extraEnv: []
#  - name: RUST_LOG
#    value: info
extraEnvFrom: []

# --- Probes -----------------------------------------------------------------
# Forward-looking defaults target the HTTP health surface the server will
# expose (/healthz). The current M1 image is a migrate-and-exit bootstrap with
# no transport; disable probes (or override to an exec/tcp probe) until the
# server transport milestone lands. See charts/memkeys/README.md.
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# --- Resources --------------------------------------------------------------
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# --- Scheduling -------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Optional container command/args override (e.g. to run the migrate-only
# bootstrap). Empty uses the image entrypoint.
command: []
args: []

# --- Workers (microservice profile) -----------------------------------------
# Async projection workers rebuild the graph/vector projections off the
# keyed/temporal source of truth. Rendered as a SEPARATE Deployment only in the
# microservice profile (or when workers.enabled is forced). Same image as the
# server; the worker role is selected via command/args. Not fronted by the
# Service.
workers:
  # null → follow the profile (on for microservice, off for single-node).
  # true/false forces the worker Deployment on/off regardless of profile.
  enabled: null
  replicaCount: 1
  # Optional container command/args override for the worker container. The
  # worker role itself is selected by the MEMKEYS_ROLE=worker env rendered by
  # the template (projection-only: no memory transport); command/args remain
  # for custom entrypoints.
  command: []
  args: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# --- PodDisruptionBudget (microservice profile) -----------------------------
# Keeps the Service-backed server available during voluntary disruptions.
# Set exactly one of minAvailable / maxUnavailable (maxUnavailable wins if set).
podDisruptionBudget:
  # null → follow the profile (on for microservice, off for single-node).
  enabled: null
  minAvailable: 1
  maxUnavailable: ""

# --- Operator integration hooks ---------------------------------------------
# Forward-looking extension points for a MemKeys/K8s operator or GitOps
# controller to select and manage the release. Labels are merged into every
# resource's metadata; annotations are applied to the rendered workloads. No
# operator ships with this chart yet. Every resource also carries
# app.kubernetes.io/part-of=memkeys for release-wide selection.
operator:
  labels: {}
  annotations: {}
